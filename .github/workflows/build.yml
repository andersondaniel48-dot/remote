name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug testDebugUnitTest 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          # Kotlin/AAPT errors as individual annotations, plus Gradle's summary.
          grep -E '^e: |AAPT: error|error: ' build.log | sort -u | head -45 | while IFS= read -r l; do
            echo "::error::${l//$'\n'/ }"
          done
          summary=$(grep -A12 'What went wrong' build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
          [ -n "$summary" ] && echo "::error title=Gradle::${summary}"
          exit 0
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TVHub-apk
          path: app/build/outputs/apk/debug/app-debug.apk
